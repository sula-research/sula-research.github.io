---
layout: page
title: Contact
description: Contact Sula Research.
comments: false
---

<p>For research or client enquiries, send a message below.</p>

<form class="site-form" id="contact-form">
    <label for="contact-name">Name</label>
    <input id="contact-name" name="name" type="text" autocomplete="name" required>

    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" required>

    <label for="contact-subject">Subject</label>
    <input id="contact-subject" name="subject" type="text" required>

    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" rows="6" required></textarea>

    <button class="btn" type="submit">Send message</button>
</form>

<script>
(function () {
    var form = document.getElementById('contact-form');
    var recipient = {{ site.email | default: '' | jsonify }};

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!recipient) {
            return;
        }

        var name = form.elements.name.value.trim();
        var email = form.elements.email.value.trim();
        var subject = form.elements.subject.value.trim();
        var message = form.elements.message.value.trim();
        var body = 'From: ' + name + ' <' + email + '>\n\n' + message;
        var mailto = 'mailto:' + recipient + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        window.location.href = mailto;
    });
}());
</script>
